<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">IGoLibrary 首页示例</title>
  <desc id="desc">使用虚构数据展示的 IGoLibrary 桌面首页</desc>
  <rect width="1600" height="960" fill="#f5f7fb"/>
  <rect width="300" height="960" fill="#f8fafc"/>
  <rect x="300" width="1" height="960" fill="#e2e8f0"/>
  <text x="48" y="48" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#334155">IGoLibrary</text>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#334155">
    <rect x="24" y="86" width="252" height="64" rx="12" fill="#e4f1ff"/>
    <text x="58" y="126">⌂</text><text x="98" y="126">首页</text>
    <text x="58" y="196">●</text><text x="98" y="196">账户与场馆</text>
    <text x="58" y="266">ϟ</text><text x="98" y="266">抢座</text>
    <text x="58" y="336">◷</text><text x="98" y="336">占座</text>
    <text x="58" y="406">◉</text><text x="98" y="406">退座</text>
    <text x="58" y="476">●</text><text x="98" y="476">通知设置</text>
    <text x="58" y="546">⚙</text><text x="98" y="546">系统设置</text>
    <text x="58" y="616">▣</text><text x="98" y="616">使用指南</text>
  </g>
  <text x="32" y="890" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#94a3b8">示例数据 · 仅用于项目展示</text>
  <g transform="translate(350 54)" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect width="1190" height="220" rx="28" fill="#eaf4ff"/>
    <rect x="850" y="28" width="300" height="164" rx="22" fill="#ffffff"/>
    <rect x="30" y="30" width="156" height="38" rx="19" fill="none" stroke="#b9dcff" stroke-width="2"/>
    <text x="50" y="56" font-size="17" font-weight="700" fill="#0879d1">个人专属仪表盘</text>
    <text x="30" y="120" font-size="34" font-weight="700" fill="#0f172a">晚上好，读者</text>
    <text x="30" y="160" font-size="18" fill="#475569">把今天最后一段时间安排好吧。</text>
    <text x="884" y="68" font-size="18" font-weight="700" fill="#475569">2026 年 01 月 01 日</text>
    <text x="884" y="124" font-size="48" font-weight="700" fill="#0f172a">19:28:00</text>
    <rect x="884" y="142" width="190" height="30" rx="15" fill="#e1f8eb"/>
    <circle cx="904" cy="157" r="6" fill="#16804a"/><text x="920" y="163" font-size="14" font-weight="700" fill="#16804a">核心引擎就绪</text>
  </g>
  <g transform="translate(350 306)" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <g>
      <rect width="360" height="150" rx="24" fill="#ffffff"/>
      <text x="26" y="38" font-size="17" font-weight="700" fill="#94a3b8">当前锁定场馆</text>
      <text x="26" y="88" font-size="28" font-weight="700" fill="#0f172a">示例阅览室 · 2楼</text>
      <rect x="26" y="106" width="92" height="28" rx="14" fill="#e1f8eb"/><circle cx="42" cy="120" r="5" fill="#16804a"/><text x="54" y="125" font-size="14" fill="#16804a">已授权</text>
    </g>
    <g transform="translate(380)">
      <rect width="360" height="150" rx="24" fill="#ffffff"/>
      <text x="26" y="38" font-size="17" font-weight="700" fill="#94a3b8">历史成功次数</text>
      <text x="26" y="102" font-size="48" font-weight="700" fill="#0f172a">12</text>
    </g>
    <g transform="translate(760)">
      <rect width="390" height="150" rx="24" fill="#ffffff"/>
      <text x="26" y="38" font-size="17" font-weight="700" fill="#94a3b8">累计守护时长</text>
      <text x="26" y="102" font-size="42" font-weight="700" fill="#0f172a">2 小时 30 分</text>
    </g>
  </g>
  <g transform="translate(350 490)" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect width="760" height="390" rx="24" fill="#eef6ff"/>
    <text x="28" y="42" font-size="18" font-weight="700" fill="#7892ae">预约记录</text>
    <rect x="28" y="66" width="704" height="132" rx="20" fill="#ffffff"/>
    <text x="54" y="132" font-size="52" font-weight="700" fill="#0f172a">101</text>
    <text x="54" y="164" font-size="15" fill="#7892ae">座位号</text>
    <text x="240" y="116" font-size="21" font-weight="700" fill="#0f172a">示例阅览室（2楼）</text>
    <text x="240" y="154" font-size="18" fill="#334155">状态：学习中 2.5 小时</text>
    <rect x="580" y="92" width="110" height="38" rx="19" fill="#e1f1ff"/><circle cx="602" cy="111" r="6" fill="#0879d1"/><text x="616" y="117" font-size="14" font-weight="700" fill="#0879d1">生效中</text>
    <rect x="28" y="220" width="704" height="132" rx="20" fill="#ffffff"/>
    <text x="54" y="286" font-size="52" font-weight="700" fill="#0f172a">205</text>
    <text x="54" y="318" font-size="15" fill="#7892ae">座位号</text>
    <text x="240" y="270" font-size="21" font-weight="700" fill="#0f172a">示例阅览室（2楼）</text>
    <text x="240" y="308" font-size="18" fill="#334155">预约日期：2026-01-02</text>
    <rect x="580" y="246" width="110" height="38" rx="19" fill="#e1f1ff"/><circle cx="602" cy="265" r="6" fill="#0879d1"/><text x="616" y="271" font-size="14" font-weight="700" fill="#0879d1">明日生效</text>
  </g>
  <g transform="translate(1140 490)" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect width="400" height="390" rx="24" fill="#ffffff"/>
    <text x="28" y="42" font-size="18" font-weight="700" fill="#7892ae">个人信息</text>
    <g fill="#f7fafc">
      <rect x="28" y="68" width="160" height="110" rx="18"/><rect x="212" y="68" width="160" height="110" rx="18"/>
      <rect x="28" y="196" width="160" height="110" rx="18"/><rect x="212" y="196" width="160" height="110" rx="18"/>
    </g>
    <g fill="#7892ae" font-size="16"><text x="48" y="104">学习时间</text><text x="232" y="104">排名</text><text x="48" y="232">单日最长</text><text x="232" y="232">积分</text></g>
    <g fill="#0f172a" font-size="27" font-weight="700"><text x="48" y="145">36h</text><text x="232" y="145">第 18 名</text><text x="48" y="273">6h</text><text x="232" y="273">128</text></g>
  </g>
</svg>
